<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded badge -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>

  <!-- Dorsal fin (top) -->
  <path d="M26 21 C30 14 38 15 42 20 Z" fill="url(#finGrad)" opacity="0.9"/>
  <!-- Tail fin (right side) -->
  <path d="M42 32 L54 20 C52 28 52 36 54 44 Z" fill="url(#finGrad)"/>

  <!-- Fish main body (head on the left, tail on the right) -->
  <path d="M12 32 C12 24 24 19 38 23 C45 25 46 32 46 32 C46 32 45 39 38 41 C24 45 12 40 12 32 Z" fill="url(#fishGrad)"/>

  <!-- Pectoral fin (lower middle) -->
  <path d="M28 33 C33 34 36 38 34 41 C30 41 27 37 28 33 Z" fill="url(#finGrad)"/>

  <!-- Eye (on the head, near front-left) -->
  <circle cx="20" cy="29" r="3.2" fill="#ffffff"/>
  <circle cx="19" cy="29" r="1.6" fill="#0f172a"/>
  <!-- Catchlight in eye -->
  <circle cx="18.2" cy="28.2" r="0.7" fill="#ffffff"/>

  <!-- Smile / mouth at snout -->
  <path d="M13 33 Q15 35 17 33" stroke="#0369a1" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>