name: Migrate User Profiles & Clean Legacy Docs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect database and report counts without modifying anything'
        type: boolean
        default: false
      delete_legacy_market_docs:
        description: 'Also delete old /fishao_market/prices_summary and prices_history docs'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate migration script syntax
        run: node --check scripts/migrate-user-profiles.mjs

      - name: Cache firebase-admin
        id: cache-firebase-admin
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-firebase-admin-13

      - name: Install firebase-admin
        if: ${{ steps.cache-firebase-admin.outputs.cache-hit != 'true' }}
        run: npm install --no-save --no-audit --no-fund firebase-admin@^13.0.0

      - name: Run one-time user profile migration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.delete_legacy_market_docs }}" = "true" ]; then
            FLAGS="$FLAGS --delete-legacy-market"
          fi
          node scripts/migrate-user-profiles.mjs $FLAGS
