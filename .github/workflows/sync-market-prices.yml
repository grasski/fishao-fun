name: Sync Fish Market Prices

on:
  # Temporarily paused while fishao.net returns Cloudflare HTTP 403.
  # Re-enable once automated access is resolved (and remember to pause/re-enable cron-job.org too).
  # schedule:
  #   # Backup trigger at 00:05 UTC (primary trigger runs via cron-job.org at 00:02 UTC; sync_status skips duplicate runs)
  #   - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch prices without writing to Firestore'
        type: boolean
        default: false
      force:
        description: 'Force sync even if already synced today (or on Sunday)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache sync dependencies (firebase-admin)
        id: cache-sync-deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-sync-market-firebase-13

      - name: Install sync dependencies
        if: steps.cache-sync-deps.outputs.cache-hit != 'true'
        run: npm install --no-save --no-audit --no-fund firebase-admin@^13.0.0

      - name: Sync market prices to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCRAPE_API_TOKEN: ${{ secrets.SCRAPE_API_TOKEN }}
          FORCE_SYNC: ${{ inputs.force && '1' || '' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-market-prices.mjs --dry-run
          else
            node scripts/sync-market-prices.mjs
          fi
