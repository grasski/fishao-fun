name: Sync Fish Market Prices

on:
  schedule:
    # Run daily at 00:05 UTC (slightly after midnight to avoid UTC 00:00 queue spikes)
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch prices without writing to Firestore'
        type: boolean
        default: false
      force:
        description: 'Force sync even if already synced today (or on Sunday)'
        type: boolean
        default: false
      migrate_only:
        description: 'Only migrate legacy prices_history to prices_summary + daily archive'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache firebase-admin
        id: cache-firebase-admin
        if: ${{ !inputs.dry_run }}
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-firebase-admin-13

      - name: Install firebase-admin
        if: ${{ !inputs.dry_run && steps.cache-firebase-admin.outputs.cache-hit != 'true' }}
        run: npm install --no-save --no-audit --no-fund firebase-admin

      - name: Sync market prices to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SYNC: ${{ inputs.force && '1' || '' }}
        run: |
          if [ "${{ inputs.migrate_only }}" = "true" ]; then
            node scripts/sync-market-prices.mjs --migrate-only
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-market-prices.mjs --dry-run
          else
            node scripts/sync-market-prices.mjs
          fi
