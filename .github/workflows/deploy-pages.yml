name: Deploy FISHAO to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript syntax & i18n keys
        run: |
          for f in js/*.js data/*.js data/i18n/*.js scripts/*.mjs; do
            node --check "$f"
          done
          node -e "
            const cs = Object.keys(require('./data/i18n/ui_cs.js'));
            const en = Object.keys(require('./data/i18n/ui_en.js'));
            const pl = Object.keys(require('./data/i18n/ui_pl.js'));
            const missEn = cs.filter(k => !k.endsWith('_few') && !k.endsWith('_many') && !en.includes(k));
            const missPl = cs.filter(k => !pl.includes(k));
            if (missEn.length || missPl.length) {
              console.error('Missing i18n keys:', { missEn, missPl });
              process.exit(1);
            }
            console.log('i18n parity OK: cs=' + cs.length + ', en=' + en.length + ', pl=' + pl.length);
          "

      - name: Install esbuild for JS/CSS minification
        run: npm install --no-save esbuild

      - name: Build bundled dist
        run: python scripts/build_dist.py --out _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
