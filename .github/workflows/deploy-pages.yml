name: Deploy FISHAO to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate JavaScript syntax & i18n keys
        run: |
          for f in js/*.js data/*.js data/i18n/*.js scripts/*.mjs; do
            node --check "$f"
          done
          node -e "
            const cs = Object.keys(require('./data/i18n/ui_cs.js'));
            const langs = {
              en: { keys: Object.keys(require('./data/i18n/ui_en.js')), allowMissingFewMany: true },
              pl: { keys: Object.keys(require('./data/i18n/ui_pl.js')), allowMissingFewMany: false },
              nl: { keys: Object.keys(require('./data/i18n/ui_nl.js')), allowMissingFewMany: true },
              ro: { keys: Object.keys(require('./data/i18n/ui_ro.js')), allowMissingFewMany: false },
              tr: { keys: Object.keys(require('./data/i18n/ui_tr.js')), allowMissingFewMany: true }
            };
            const missing = {};
            for (const [code, info] of Object.entries(langs)) {
              const miss = cs.filter(k => (!info.allowMissingFewMany || (!k.endsWith('_few') && !k.endsWith('_many'))) && !info.keys.includes(k));
              if (miss.length) missing[code] = miss;
            }
            if (Object.keys(missing).length) {
              console.error('Missing i18n keys:', missing);
              process.exit(1);
            }
            console.log('i18n parity OK: cs=' + cs.length + ', ' + Object.entries(langs).map(([c, i]) => c + '=' + i.keys.length).join(', '));
          "

      - name: Validate CSS braces & custom properties
        run: |
          python - <<'EOF'
          import glob, re, sys
          defs, uses, errs = set(), {}, []
          for f in sorted(glob.glob('css/*.css')):
              s = open(f, encoding='utf-8').read()
              defs.update(re.findall(r'(--[a-zA-Z0-9_-]+)\s*:', s))
              for m in re.finditer(r'var\((--[a-zA-Z0-9_-]+)\)', s):
                  uses.setdefault(m.group(1), []).append(f)
              o, c = s.count('{'), s.count('}')
              if o != c:
                  errs.append(f'Brace mismatch in {f}: {o} != {c}')
          missing = {k: v for k, v in uses.items() if k not in defs}
          if missing:
              errs.append(f'Undefined CSS variables: {missing}')
          if errs:
              print('\n'.join(errs))
              sys.exit(1)
          print('CSS validation OK')
          EOF

      - name: Install esbuild for JS/CSS minification
        run: npm install --no-save esbuild@^0.24.0

      - name: Build bundled dist
        run: python scripts/build_dist.py --out _site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
